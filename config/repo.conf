# ============================================================
# 👑 King OS Repository Configuration
# ============================================================
# Auto-loaded by all scripts. Do not edit unless you know.
# ============================================================

# --- GitHub remote ---
GIT_URL="https://github.com/Mahenking/King-Technology.git"
GIT_BRANCH="main"
GIT_USER="Mahenking"

# --- Repo paths ---
REPO_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
PACKAGES_LIST="$REPO_ROOT/packages.txt"
INDEX_FILE="$REPO_ROOT/index.json"
PACKAGES_DIR="$REPO_ROOT/packages"
TEMP_DIR="/tmp/king-repo-temp"

# --- Multi-source settings (used by scraper/find-package-urls.sh) ---
# The actual source list is in config/sources.conf

# --- Version retention ---
# Keep this many newest versions per package
KEEP_VERSIONS=3

# --- Dependency resolution ---
# Max depth when walking Depends/Pre-Depends
#   0 = no auto-deps (just what's in packages.txt)
#   1 = direct deps only
#   2 = deps of deps
#   4 = recommended (deep enough for python/ros trees)
#   99 = unlimited (dangerous)
DEP_MAX_DEPTH=4

# Comma-separated list of dep fields to follow
# (Recommended: only hard deps — skip Recommends/Suggests)
DEP_FIELDS="Depends,Pre-Depends"

# Essential packages that ship with King OS base.
# These are skipped during dep resolution to keep the repo lean.
# Format: one package name per line inside the quotes.
SKIP_DEPS="
libc6
libc6-dev
libgcc-s1
libgcc-13-dev
libgcc-14-dev
libcrypt1
libstdc++6
base-files
base-passwd
bash
dash
coreutils
libc-bin
zlib1g
libselinux1
libpcre2-8-0
libpcre2-16-0
libpcre2-32-0
libattr1
libacl1
libcap2
libaudit1
libsystemd0
liblz4-1
liblzma5
libzstd1
libbz2-1.0
libuuid1
libblkid1
libmount1
libsmartcols1
libfdisk1
libext2fs2
dpkg
apt
"

# --- Behavior flags ---
# Verify SHA256 before pushing
VERIFY_SHA=true

# Log every action to a file
ENABLE_LOGGING=false
LOG_FILE="$REPO_ROOT/build.log"

# --- Colors (set to false for CI logs) ---
USE_COLORS=true
